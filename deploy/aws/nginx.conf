server {
    listen 80 default_server;
    server_name 13.209.166.150;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://13.209.166.150$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name 13.209.166.150;
    ssl_certificate /etc/letsencrypt/live/13.209.166.150/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.209.166.150/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DJYTLS:10m;
    ssl_session_timeout 1d;
    gzip on;
    gzip_types application/json application/javascript text/javascript text/css;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_vary on;
    client_max_body_size 128k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;
    proxy_connect_timeout 3s;
    location = /coach { return 302 /coach/; }
    location ^~ /coach/ {
        alias /opt/djy-telemetry/web/coach/;
        index index.html;
        add_header Cache-Control "no-cache";
        limit_except GET { deny all; }
    }
    location = /api/vehicle/exchange { proxy_pass http://127.0.0.1:8766; }
    location = /api/gnss/native { proxy_pass http://127.0.0.1:8766; }
    location = /api/gnss { proxy_pass http://127.0.0.1:8766; }
    location = /api/driver-message {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8766;
    }
    # Gate/start/stop remain subject to gateway validation; calibration stays local.
    location = /api/gnss/control {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8766;
    }
    location = /api/records/control {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8766;
    }
    location / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8766;
    }
}
